<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bên Khung Cửa Nhỏ</title>
<link rel="icon" href="{{ICON}}">
<link rel="apple-touch-icon" href="{{ICON}}">
<meta name="theme-color" content="#2b2d42">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;1,500&family=Patrick+Hand&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FDF8EE;
    --paper-line: #D4C5B0;
    --ink: #4A3525;
    --cream: #FFF8F0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1F1D2B; overscroll-behavior: none; }
  .hit, #mute { touch-action: none; }
  body {
    font-family: 'Quicksand', system-ui, sans-serif;
    color: var(--ink);
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  /* blurred copy of the scene behind the stage on wide screens */
  #backdrop {
    position: fixed; inset: -40px; background-size: cover; background-position: center;
    filter: blur(28px) brightness(.55) saturate(1.1); transition: background-image 1.2s;
  }
  #stage {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    overflow: hidden; border-radius: 0; box-shadow: 0 20px 60px rgba(0,0,0,.45);
    background: #e9dcc6;
  }
  @media (min-aspect-ratio: 3/4) { #stage { border-radius: 18px; } }
  .layer { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scene { object-fit: fill; opacity: 0; transition: opacity 1.4s ease; pointer-events: none; }
  .scene.on { opacity: 1; }
  .masked-sky { -webkit-mask-image: var(--sky); mask-image: var(--sky);
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%; pointer-events: none; }
  .masked-room { -webkit-mask-image: var(--room); mask-image: var(--room);
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%; pointer-events: none; }
  #tint { mix-blend-mode: multiply; transition: background-color 1.4s ease; }
  #glow { mix-blend-mode: screen; transition: opacity .9s ease; opacity: 0; }
  #sunlight { mix-blend-mode: soft-light; transition: opacity 1.4s ease; opacity: 0; pointer-events: none;
    background: radial-gradient(60% 40% at 45% 52%, rgba(255,190,120,.75), rgba(255,170,110,0) 70%); }

  .hit { position: absolute; background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
    outline: none; }
  .hit:focus-visible { outline: 2px dashed rgba(255,255,255,.7); outline-offset: 2px; border-radius: 12px; }
  .prop { position: absolute; pointer-events: none; transform-origin: 50% 100%;
    filter: drop-shadow(0 3px 3px rgba(60,35,20,.28)); transition: filter .8s ease; }
  #p-chime { transform-origin: 50% 0%; filter: drop-shadow(0 2px 2px rgba(20,30,60,.25)); }
  #p-lamp.off { filter: drop-shadow(0 3px 3px rgba(60,35,20,.28)) brightness(.9) saturate(.7); }
  #p-radio.on { animation: bop var(--beat, .833s) ease-in-out infinite; }
  @keyframes bop { 0%,100% { transform: scale(1,1); } 12% { transform: scale(1.012,.985); } }
  .wiggle { animation: wiggle 1.1s ease-in-out; }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-3deg); } 45% { transform: rotate(2.2deg); }
    70% { transform: rotate(-1deg); } }
  .press { animation: press .35s ease; }
  @keyframes press { 40% { transform: scale(.95); } 75% { transform: scale(1.03); } }

  #wring { position: absolute; border-radius: 999px; pointer-events: none;
    box-shadow: 0 0 0 2px rgba(255,255,255,.95), 0 0 14px 3px rgba(255,236,190,.75);
    transition: left .5s cubic-bezier(.4,1.4,.6,1); }

  /* paper note */
  #note-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(31,29,43,.35); opacity: 0; pointer-events: none; transition: opacity .4s ease; }
  #note-wrap.show { opacity: 1; pointer-events: auto; }
  #note { width: 78%; max-width: 420px; background: var(--paper); border-radius: 16px;
    border: 1.5px dashed var(--paper-line); padding: 7% 7% 6%; transform: translateY(14px) rotate(-1.2deg);
    transition: transform .5s cubic-bezier(.2,1.2,.4,1); box-shadow: 0 14px 40px rgba(40,25,10,.3);
    font-family: 'Patrick Hand', 'Quicksand', cursive; font-size: clamp(17px, 2.9vh, 24px); line-height: 1.45;
    color: #5b4330; text-align: center; max-height: 88%; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
  #note-wrap.show #note { transform: translateY(0) rotate(-1.2deg); }
  #note small { display: block; margin-top: 1.1em; font-family: 'Quicksand', sans-serif; font-size: .62em;
    color: #a08a72; letter-spacing: .04em; }

  #vbub { position: absolute; z-index: 19; pointer-events: none; max-width: 52%; transform: translate(-50%, calc(-100% - 10px)) scale(.9); opacity: 0;
    background: rgba(255,250,240,.96); color: #5b4636; border-radius: 18px; padding: .55em .85em; font-size: clamp(12px, 1.8vh, 16px); line-height: 1.4;
    box-shadow: 0 4px 14px rgba(40,25,10,.25); transition: opacity .35s, transform .35s; }
  #vbub::after { content: ''; position: absolute; left: var(--tail, 50%); bottom: -9px; border: 9px solid transparent; border-bottom: 0; border-top-color: rgba(255,250,240,.96); transform: translateX(-50%); }
  #vbub.show { opacity: 1; transform: translate(-50%, calc(-100% - 10px)) scale(1); }
  #p-rope { position: absolute; height: 0; border-top: 1.5px solid rgba(110,80,50,.75); transform-origin: left center; transform: rotate(-7deg); opacity: 0; transition: opacity 1s; pointer-events: none; }
  #p-bag { position: absolute; opacity: 0; transition: opacity 1s, transform .6s; pointer-events: none; transform-origin: 50% 0; animation: bagSway 4s ease-in-out infinite; }
  #p-bag img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 3px 4px rgba(40,25,10,.3)); }
  #p-bag::after { content: ''; position: absolute; left: 30%; bottom: 14%; width: 38%; height: 22%; border-radius: 3px; background: #fff7e6; box-shadow: 0 1px 3px rgba(40,25,10,.35); transform: rotate(-14deg); opacity: 0; transition: opacity .6s; }
  #p-rope.on, #p-bag.on { opacity: 1; }
  #p-bag.mail::after { opacity: 1; }
  @keyframes bagSway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  #petals { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
  #petals i { position: absolute; top: -40px; width: calc(18px * var(--s)); height: calc(14px * var(--s)); border-radius: 80% 10% 80% 10%;
    background: radial-gradient(circle at 30% 30%, #ffd3e2, #f39ab8 70%); opacity: .85; animation: petal linear forwards; }
  @keyframes petal { 0% { transform: translate(0, 0) rotate(0); opacity: 0; } 10% { opacity: .9; }
    50% { transform: translate(var(--sway), 55vh) rotate(200deg); } 100% { transform: translate(calc(var(--sway) * -.5), 110vh) rotate(420deg); opacity: .7; } }
  #dj { position: absolute; z-index: 18; left: 4%; right: 4%; bottom: 19%; pointer-events: none; opacity: 0; transition: opacity .8s;
    background: rgba(25,20,30,.55); color: #f6ead8; border-radius: 14px; padding: .5em .8em; font: 500 clamp(12px, 1.75vh, 15px)/1.45 'Quicksand', sans-serif; backdrop-filter: blur(3px); }
  #dj { display: flex; gap: .7em; align-items: center; } #dj img { width: 4.2em; height: 4.2em; object-fit: cover; border-radius: 10px; flex: none; }
  #dj small { display: block; font-size: .78em; opacity: .65; letter-spacing: .05em; }
  #dj.show { opacity: 1; }
  #toast { z-index: 20; position: absolute; left: 50%; bottom: 13.5%; transform: translateX(-50%) translateY(8px);
    background: rgba(253,248,238,.94); color: #6b5540; border-radius: 18px; padding: .55em 1.1em;
    font-size: clamp(12px, 1.9vh, 16px); font-weight: 600; width: max-content; max-width: 86%; text-align: center; line-height: 1.35; opacity: 0;
    transition: opacity .5s ease, transform .5s ease; pointer-events: none; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* intro */
  #intro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1.2em; cursor: pointer; text-align: center; color: var(--cream);
    background: radial-gradient(120% 80% at 50% 45%, rgba(31,29,43,.55), rgba(20,18,30,.88));
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); transition: opacity 1.4s ease; z-index: 10; }
  #intro .cover { width: 88%; max-width: 520px; border-radius: 14px; box-shadow: 0 12px 36px rgba(20,15,30,.45); }
  #intro.gone { opacity: 0; pointer-events: none; }
  #intro h1 { font-family: 'Lora', Georgia, serif; font-weight: 500; font-size: clamp(28px, 5.4vh, 46px);
    margin: 0; letter-spacing: .01em; text-shadow: 0 2px 18px rgba(0,0,0,.4); }
  #intro .en { font-family: 'Lora', Georgia, serif; font-style: italic; opacity: .75; margin-top: -.6em;
    font-size: clamp(14px, 2.2vh, 18px); }
  #intro .tap { margin-top: 1.6em; font-size: clamp(14px, 2.1vh, 17px); font-weight: 600; letter-spacing: .05em;
    padding: .75em 1.5em; border-radius: 999px; background: rgba(255,248,240,.14);
    border: 1px solid rgba(255,248,240,.35); animation: breathe 3.2s ease-in-out infinite; }
  #intro .hint { font-size: clamp(11px, 1.6vh, 13px); opacity: .6; }
  @keyframes breathe { 0%,100% { opacity: .65; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }

  #mute { position: absolute; left: 3.2%; top: 2.6%; width: 11%; aspect-ratio: 126 / 97; border-radius: 30%;
    border: 0; background: center / contain no-repeat; color: #6b5540; font-size: clamp(12px, 2vh, 18px);
    display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 5; }
  .visitor { opacity: 0; translate: 0 14px; transition: opacity .9s ease, translate .9s cubic-bezier(.3,1.5,.5,1); }
  .visitor.here { opacity: 1; translate: 0 0; animation: idle 3.6s ease-in-out infinite; }
  .visitor.away { opacity: 0; translate: 60px -90px; transition: opacity 1s ease, translate 1.2s ease-in; }
  @keyframes idle { 0%,100% { scale: 1 1; } 50% { scale: 1.015 .985; } }
  #p-owl { transform-origin: 50% 85%; }
  .hop { animation: hop .5s ease !important; }
  @keyframes hop { 30% { transform: translateY(-9%) scale(1.02,.98); } 60% { transform: translateY(0) scale(1.04,.94); } }
  .tilt { animation: tilt 1.4s ease-in-out !important; }
  @keyframes tilt { 25% { transform: rotate(-9deg); } 60% { transform: rotate(6deg); } }
  #note:has(.nb) { background: none; border: 0; box-shadow: none; width: 96%; max-width: 560px; padding: 0; }
  .nb { position: relative; } .nb img { width: 100%; display: block; filter: drop-shadow(0 10px 18px rgba(30,20,10,.35)); }
  .nb p { position: absolute; top: 13%; width: 36%; max-height: 78%; overflow: hidden; margin: 0; font-family: 'Patrick Hand', cursive; font-size: clamp(11px, 1.75vh, 16px); line-height: 1.5; color: #5b4636; }
  .nb .l { left: 7%; } .nb .r { left: 56%; font-style: italic; }
  .nb div.l { position: absolute; top: 11%; width: 37%; max-height: 82%; display: flex; flex-direction: column; gap: .35em; font-family: 'Patrick Hand', cursive; font-size: clamp(11px, 1.7vh, 16px); line-height: 1.35; color: #5b4636; }
  .nb .th, .dpage small { margin: 0; font-size: .78em; letter-spacing: .04em; opacity: .6; text-transform: uppercase; }
  .nb textarea { font: inherit; color: #3f2f22; background: repeating-linear-gradient(transparent 0 1.3em, rgba(120,90,60,.22) 1.3em calc(1.3em + 1px)); border: 0; outline: none; resize: none; width: 100%; padding: 0; line-height: 1.3em; }
  .nb .moods { display: flex; gap: .2em; } .nb .moods button { font-size: 1.1em; background: none; border: 0; padding: .1em; cursor: pointer; }
  .nb #nb-save, .nb #nb-old { font: inherit; background: rgba(255,240,215,.8); border: 1px solid rgba(120,90,60,.35); border-radius: 999px; padding: .15em .6em; color: #5b4636; cursor: pointer; align-self: flex-start; }
  .nb #nb-old { display: block; margin-top: .8em; font-style: normal; }
  .nb .ans, .dpage .ans { color: #3f2f22; white-space: pre-wrap; overflow-wrap: anywhere; }
  .stamp { display: inline-block; width: 2.8em; height: 2.8em; transform: rotate(-12deg); opacity: .9; align-self: flex-end; mix-blend-mode: multiply; }
  .stamp.fresh { animation: stampIn .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes stampIn { from { transform: scale(2.2) rotate(-30deg); opacity: 0; } to { transform: scale(1) rotate(-12deg); opacity: .85; } }
  .dpage { position: relative; border-top: 1px dashed rgba(120,90,60,.3); padding: .5em 0; } .dpage .q { margin: .2em 0; opacity: .75; } .dpage .ans { margin: .2em 3em .2em 0; }
  .dpage .stamp { position: absolute; right: 0; top: .9em; font-size: 1em; } .dpage { padding-right: 2.6em; }
  .vol { display: block; margin: .9em 0; } .vol span { display: block; font-size: .9em; margin-bottom: .3em; }
  .vol input { width: 100%; accent-color: #d9a55a; }
  .ring { position: absolute; border-radius: 50%; pointer-events: none;
    box-shadow: 0 0 0 3px rgba(255,244,200,.95), 0 0 28px 12px rgba(255,225,140,.7); animation: ring 2.2s ease-in-out infinite; }
  @keyframes ring { 0%,100% { opacity: .45; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.04); } }
  #candle-t { position: absolute; pointer-events: none; font: 600 clamp(10px, 1.5vh, 13px) 'Quicksand', sans-serif;
    color: #fff6e0; background: rgba(60,40,25,.55); border-radius: 999px; padding: .1em .55em; text-align: center; display: none; }
  .jl { margin: 0 0 1em; }
  .jh { display: flex; gap: .6em; align-items: center; margin-bottom: .4em; }
  .jh img { height: 2.6em; width: 2.6em; object-fit: contain; }
  .jh small { display: block; margin: 0; opacity: .7; }
  .jc { border-top: 1px dashed rgba(120,90,60,.3); padding: .45em .1em; }
  .jc summary { cursor: pointer; list-style: none; }
  .jc summary::-webkit-details-marker { display: none; }
  .jc summary::after { content: ' ›'; opacity: .5; }
  .jc[open] summary::after { content: ' ⌄'; }
  .jc p { margin: .5em 0 .2em; line-height: 1.55; }
  .jc.lock { opacity: .45; }
  .flav { margin: -.2em 0 .8em; padding: .5em .8em; border-radius: 14px; background: rgba(255,255,255,.55); font-style: italic; line-height: 1.45; text-align: center; }
  .fade { animation: fadeIn .5s ease; } @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } }
  .wig { animation: wig .5s ease; } @keyframes wig { 25% { transform: rotate(-2deg); } 75% { transform: rotate(2deg); } }
  .tw { opacity: 0; } .tw.in { opacity: 1; }
  .kw { color: #c9772f; font-weight: 600; }
  .bub { background: rgba(255,255,255,.6); border-radius: 16px; padding: .55em .8em; margin: .2em 0 .6em; box-shadow: 0 1px 4px rgba(90,60,30,.12); }
  .more { opacity: .6; text-align: right; animation: breathe 2.4s ease-in-out infinite; }
  #note.letter { background: #FBF3E2; border-style: solid; font-family: 'Lora', Georgia, serif; font-style: italic;
    font-size: clamp(15px, 2.5vh, 20px); text-align: left; }
  #note.panel { text-align: left; font-family: 'Quicksand', sans-serif; font-size: clamp(13px, 2vh, 16px); transform: none; }
  #note.panel h3 { font-family: 'Lora', Georgia, serif; font-weight: 500; font-size: 1.35em; margin: 0 0 .7em; text-align: center; }
  .seed { display: flex; gap: .8em; align-items: center; width: 100%; text-align: left; border: 1.5px solid var(--paper-line);
    background: #fffdf7; border-radius: 12px; padding: .6em .8em; margin: .45em 0; font: inherit; color: inherit; cursor: pointer; }
  .seed img { width: 3.2em; height: 3.2em; object-fit: contain; }
  .seed b { display: block; font-size: 1.05em; }
  .seed span { color: #8a735c; font-size: .85em; }
  .keep { display: flex; justify-content: space-between; padding: .45em .2em; border-bottom: 1px dashed var(--paper-line); }
  #note.panel small { text-align: center; }
  #p-plane.here { animation: none; }
  #p-cookies, #p-tea { transition: opacity .6s ease; }
  .paper-img { display: block; width: 62%; max-width: 230px; margin: 0 auto .9em; border-radius: 4px; }
  .reply img { height: 1.6em; vertical-align: middle; margin-right: .4em; }
  .chimes { display: flex; justify-content: center; gap: .8em; }
  .chime-pick { border: 0; background: rgba(255,255,255,.5); border-radius: 12px; padding: .35em .6em; cursor: pointer; }
  .chime-pick.on { box-shadow: 0 0 0 2px #d9a55a; }
  .chime-pick img { height: 4.2em; width: auto; display: block; }
  .keep img { width: 2.2em; height: 2.2em; object-fit: contain; vertical-align: middle; margin-right: .4em; }
  .keep[data-item] { cursor: pointer; }
  .keep .hint { display: block; font-size: .78em; color: #a08a72; margin-left: 2.9em; }
  .reply { display: block; width: 100%; margin: .5em 0 0; padding: .6em .8em; border-radius: 12px; border: 1.5px solid var(--paper-line);
    background: #fffdf7; font: inherit; font-style: normal; font-size: .85em; color: inherit; text-align: left; cursor: pointer; }
  .breath { display: flex; flex-direction: column; align-items: center; gap: 1.4em; padding: .6em 0; }
  .breath .cupv { position: relative; width: 13em; }
  .breath .cupv img:first-child { width: 100%; display: block; }
  .breath .cupv .dot { position: absolute; left: 24%; top: 12%; width: 40%; height: auto; opacity: .55; background: none; transform: scale(.7); transition: transform 4s ease-in-out; }
  .breath .dot0 { width: 4.2em; height: 4.2em; border-radius: 50%; background: radial-gradient(circle, #ffe7b8, #f4c58c);
    box-shadow: 0 0 30px rgba(244,197,140,.7); transform: scale(.7); transition: transform 4s ease-in-out; }
  .breath p { margin: 0; font-family: 'Lora', serif; font-style: italic; font-size: 1.25em; min-height: 1.5em; text-align: center; }
  @media (prefers-reduced-motion: reduce) {
    #p-radio.on, .wiggle, .press, #intro .tap { animation: none !important; }
  }
</style>
</head>
<body>
<div id="backdrop"></div>
<div id="stage" style="--sky:url({{SKY_MASK}});--room:url({{ROOM_MASK}})">
  <img class="layer scene" data-w="sunset" src="{{SCENE_sunset}}" alt="">
  <img class="layer scene" data-w="rain" src="{{SCENE_rain}}" alt="">
  <img class="layer scene" data-w="night" src="{{SCENE_night}}" alt="">
  <canvas id="sky" class="layer masked-sky"></canvas>
  <div id="sunlight" class="layer masked-room"></div>

  <img id="p-w_sunset" class="prop" src="{{PROP_w_sunset}}" alt="" style="filter:none">
  <img id="p-w_rain" class="prop" src="{{PROP_w_rain}}" alt="" style="filter:none">
  <img id="p-w_night" class="prop" src="{{PROP_w_night}}" alt="" style="filter:none">
  <img id="p-plate" class="prop" src="{{PROP_plate}}" alt="" style="filter:none">
  <img id="p-chime" class="prop" src="{{PROP_chime}}" alt="">
  <img id="p-owl" class="prop visitor" src="{{PROP_owl}}" alt="">
  <img id="p-plant" class="prop" alt="">
  <img id="p-painting" class="prop" src="{{PROP_painting}}" alt="" style="opacity:0">
  <div id="p-rope"></div><div id="p-bag"><img alt=""></div>
  <img id="p-welcome" class="prop" src="{{PROP_na_note}}" alt="" style="transform:rotate(-12deg);z-index:2;pointer-events:none">
  <div id="candle-t"></div>
  <img id="p-seeds" class="prop" src="{{PROP_seeds_plate}}" alt="" style="opacity:0;transition:opacity .6s">
  <img id="p-shelf" class="prop" src="{{PROP_shelf}}" alt="">
  <img id="p-mooncake" class="prop" alt="" style="display:none">
  <img id="p-rabbit" class="prop" alt="" style="display:none">
  <img id="p-lantern" class="prop" src="{{PROP_lantern_off}}" alt="">
  <img id="p-cat" class="prop" src="{{PROP_cat_sleep}}" alt="">
  <img id="p-towel" class="prop" src="{{PROP_towel}}" alt="" style="opacity:0">
  <img id="p-nanote" class="prop" src="{{PROP_na_note}}" alt="" style="opacity:0;transition:opacity .6s">
  <img id="p-jar" class="prop" src="{{PROP_jar}}" alt="">
  <img id="p-cookies" class="prop" src="{{PROP_cookies}}" alt="" style="opacity:0">
  <img id="p-plane" class="prop visitor" src="{{PROP_plane}}" alt="">
  <img id="p-frog" class="prop visitor" src="{{PROP_frog}}" alt="">
  <img id="p-squirrel" class="prop visitor" src="{{PROP_squirrel}}" alt="">
  <img id="p-lamp" class="prop" src="{{PROP_lamp}}" alt="">
  <img id="p-radio" class="prop" src="{{PROP_radio}}" alt="">
  <img id="p-tea" class="prop" src="{{PROP_tea}}" alt="" style="opacity:0">
  <img id="p-sparrow" class="prop visitor" src="{{PROP_sparrow}}" alt="">
  <img id="p-incense" class="prop" src="{{PROP_candle_on}}" alt="">

  <div id="tint" class="layer masked-room"></div>
  <div id="glow" class="layer"></div>
  <canvas id="fx" class="layer" style="pointer-events:none"></canvas>
  <div id="wring"></div>
  <div id="hits"></div>
  <button id="mute" aria-label="Tắt / bật âm thanh">♪</button>
  <div id="vbub" aria-live="polite"></div>
  <div id="dj" aria-live="polite"><img alt=""><div><small>📻 Tần Số Hẻm Hoa Giấy</small><span></span></div></div>
  <div id="toast"></div>
  <div id="note-wrap"><div id="note"></div></div>
  <div id="intro" role="button" aria-label="Chạm để mở cửa sổ">
    <img class="cover" src="{{COVER}}" alt="Bên Khung Cửa Nhỏ — Little Sill">
    <div class="tap">Mở khung cửa nhỏ</div>

let AC = null, master, reverb, amb = {}, radioBus, ambBus, radioVol;
function makeNoise(seconds, kind) {
  const len = Math.floor(AC.sampleRate * seconds), buf = AC.createBuffer(2, len, AC.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch); let last = 0, b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < len; i++) {
      const white = Math.random() * 2 - 1;
      if (kind === 'brown') { last = (last + 0.02 * white) / 1.02; d[i] = last * 3.5; }
      else if (kind === 'pink') { b0 = 0.997 * b0 + white * 0.029591; b1 = 0.985 * b1 + white * 0.032534;
        b2 = 0.95 * b2 + white * 0.048056; d[i] = (b0 + b1 + b2 + white * 0.05) * 1.6; }
      else d[i] = white;
    }
    if (kind === 'brown') { let m = 0; for (let i = 0; i < len; i++) m += d[i]; m /= len; for (let i = 0; i < len; i++) d[i] -= m; }
    const X = Math.floor(AC.sampleRate * 0.8);   // the end fades into the start, so the loop has no click
    for (let i = 0; i < X; i++) { const a = i / X; d[i] = d[i] * a + d[len - X + i] * (1 - a); }
  }
  const out = AC.createBuffer(2, len - Math.floor(AC.sampleRate * 0.8), AC.sampleRate);
  for (let ch = 0; ch < 2; ch++) out.copyToChannel(buf.getChannelData(ch).subarray(0, out.length), ch);
  return out;
}
function makeImpulse(seconds, decay) {
  const len = Math.floor(AC.sampleRate * seconds), buf = AC.createBuffer(2, len, AC.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }

}

}

function initAudio() {
  if (AC) return;

  master = gain(S.muted ? 0 : 0.42); master.connect(AC.destination);
  reverb = AC.createConvolver(); reverb.buffer = makeImpulse(3.2, 2.6);
  chain(reverb, gain(0.32), master);
  NOISE = { white: makeNoise(5, 'white'), pink: makeNoise(6, 'pink'), brown: makeNoise(7, 'brown') };

  // rain: hiss + body + random drips
  ambBus = gain(S.volAmb); ambBus.connect(master);
  amb.rain = gain(0); amb.rain.connect(ambBus);
  loopNoise('pink', chain(filt('highpass', 450), filt('lowpass', 3200), gain(0.55), amb.rain));
  loopNoise('brown', chain(filt('lowpass', 520), gain(0.65), amb.rain));
  // night: crickets only; sunset: sparrows only (Vi 26/11: no noise bed outside the rain, the hiss belongs to the radio)
  amb.night = gain(0); amb.night.connect(ambBus);
  amb.sunset = gain(0); amb.sunset.connect(ambBus);

  radioVol = gain(S.volRadio); radioVol.connect(master);
  radioBus = gain(0); chain(radioBus, filt('lowpass', 3400), filt('highpass', 90), radioVol);
  const radioRev = gain(0.5); radioBus.connect(radioRev); radioRev.connect(radioVol);

}

// ---------------------------------------------------------------- lo-fi radio (generative)
const BPM = 72, BEAT = 60 / BPM;
stage.style.setProperty('--beat', BEAT + 's');
const midi = m => 440 * Math.pow(2, (m - 69) / 12);
// Fmaj9 - Em7 - Dm9 - Cmaj7 (voicings around middle C)
const PROG = [
  { root: 41, notes: [57, 60, 64, 67] },
  { root: 40, notes: [55, 59, 62, 64] },
  { root: 38, notes: [57, 60, 64, 65] },
  { root: 36, notes: [55, 59, 62, 64] },

const MELODY = [72, 74, 76, 79, 81, 84];
let radioTimer = null, nextBeatTime = 0, beatIndex = 0;
function epiano(t, m, dur, vel) {
  const f = midi(m);
  const o1 = AC.createOscillator(), o2 = AC.createOscillator(); o2.type = 'triangle';
  o1.frequency.value = f; o2.frequency.value = f * 2; o2.detune.value = 4 + Math.random() * 4;
  const g = gain(0), g2 = gain(0.18), lp = filt('lowpass', 1500 + vel * 900);
  o1.connect(g); o2.connect(g2); g2.connect(g); chain(g, lp, radioBus);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.06 * vel, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.02 * vel, t + 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}
function kick(t) {
  const o = AC.createOscillator(); const g = gain(0); o.frequency.setValueAtTime(115, t);
  o.frequency.exponentialRampToValueAtTime(42, t + 0.14); chain(o, g, radioBus); env(g, t, 0.004, 0.42, 0.22);
  o.start(t); o.stop(t + 0.3);
}
function snare(t) {
  const s = AC.createBufferSource(); s.buffer = NOISE.white; const f = filt('bandpass', 1700, 0.8); const g = gain(0);
  chain(s, f, g, radioBus); env(g, t, 0.003, 0.1, 0.16); s.start(t, Math.random() * 3); s.stop(t + 0.2);
  tone(t, 185, 0.06, 0.05, 'triangle', radioBus);
}
function hat(t, v) {
  const s = AC.createBufferSource(); s.buffer = NOISE.white; const f = filt('highpass', 7500); const g = gain(0);
  chain(s, f, g, radioBus); env(g, t, 0.002, 0.022 * v, 0.035); s.start(t, Math.random() * 3); s.stop(t + 0.06);
}
function bass(t, m, dur) {
  const o = AC.createOscillator(); o.frequency.value = midi(m); const g = gain(0); const lp = filt('lowpass', 320);
  chain(o, lp, g, radioBus); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.2, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.start(t); o.stop(t + dur + 0.05);
}
function scheduleBeat(t, i) {
  const bar = Math.floor(i / 4) % PROG.length, beat = i % 4, ch = PROG[bar];
  const swing = BEAT * 0.16;
  if (beat === 0) {
    ch.notes.forEach((m, k) => epiano(t + k * 0.018 + Math.random() * 0.01, m, BEAT * 3.8, 0.8 + Math.random() * 0.2));
    bass(t, ch.root, BEAT * 1.4);
  }
  if (beat === 2) bass(t + BEAT * 0.5, ch.root + 12 * (Math.random() < 0.3 ? 1 : 0), BEAT * 1.1);
  if (beat === 0 || (beat === 2 && Math.random() < 0.8)) kick(t);
  if (beat === 2 && Math.random() < 0.35) kick(t + BEAT * 0.5 + swing);

    case 'sparrow': SFX.chirp(); if (nextOldLetter() === null && floNeedsSprig() && !S.story.sparrowFloHint) { S.story.sparrowFloHint = 1; save(); say('sparrow', 'Chíp chíp! Hôm nay bay ngang đầu hẻm, tớ nghe cô bán hoa bảo cô thích mùi oải hương và sức sống của trầu bà lắm đấy!', 6500); sparrowOn = false; setTimeout(() => leave('sparrow', true), 6500); scheduleSparrow(); break; }
      if (!sparrowGift()) showLetter(); sparrowOn = false; setTimeout(() => leave('sparrow', true), 500); scheduleSparrow(); break;
  }
}
for (const [id, h] of Object.entries(HITS)) h.el.addEventListener('click', e => { e.stopPropagation(); act(id); });
for (const n of Object.keys(VIS)) VIS[n].hit.addEventListener('click', e => { e.stopPropagation(); act(n); });

// ---------------------------------------------------------------- visitors (doc: "Những vị khách theo thời tiết")
let started = false, sparrowOn = false, sparrowTimer = null;
const due = {};
const DELAY = { frog: () => rnd(5000, 10000), owl: () => rnd(3000, 6000), squirrel: () => 2200, sparrow: () => 0, plane: () => rnd(8000, 15000) };
function scheduleSparrow(first) {
  clearTimeout(sparrowTimer);
  sparrowTimer = setTimeout(() => { sparrowOn = true; }, first ? 15000 : rnd(70000, 130000));
}
function want(n) {
  switch (n) {
    case 'frog': return S.weather === 'rain';
    case 'owl': return S.weather === 'night' && !S.lamp;
    case 'squirrel': return S.weather === 'sunset' && (S.food === 'seeds' || perfT < VIS.squirrel.stayUntil);
    case 'sparrow': return S.weather !== 'night' && sparrowOn;
    case 'plane': return VIS.plane.here || planeReady();
  }
}
// what the small visitors say (lines by Vi): on arrival, when tapped, when leaving
const VLINES = {
  frog: { hi: ['Ộp... Mưa ngoài kia to quá, cho tớ trú nhờ dưới tán lá dương xỉ một chút nhé?', 'Tí tách, tí tách... Đứng ở bệ cửa nhà bạn nghe tiếng mưa rơi êm tai thật đấy!'],
    tap: ['Da tớ hơi ướt một chút, nhưng ngồi cạnh ánh đèn lồng ấm áp này thấy dễ chịu hẳn.', 'Cảm ơn bạn đã không đuổi tớ đi. Tớ sẽ hát tặng bạn một khúc đồng dao ngày mưa nhé!'],
    bye: 'Trời tạnh rồi, cầu vồng sắp lên kia kìa! Tạm biệt bạn, hẹn gặp lại vào cơn mưa sau nha!' },
  owl: { hi: ['Hù... Đêm khuya rồi mà ô cửa nhà bạn vẫn sáng đèn à? Tớ ghé qua gác đêm cùng bạn một lát nhé.', 'Con hẻm giờ này ngủ say cả rồi, chỉ còn gió mát và mùi hoa oải hương nhà bạn thoang thoảng thôi.'],
    tap: ['Đừng thức khuya quá nhé người bạn nhỏ. Nếu thấy mỏi mắt, hãy thử pha một tách trà ấm xem sao.', 'Tớ đang canh chừng sự bình yên cho cả con hẻm này đây. Bạn cứ yên tâm nghỉ ngơi nha!'],
    bye: 'Trời sắp hửng sáng rồi, đến giờ tớ đi ngủ đây. Chúc bạn một ngày mới thật dịu dàng!' },
  squirrel: { hi: ['Chít chít! Mùi hạt hướng dương thơm quá đi mất, tớ xin phép nhâm nhi một chút nhé!', 'Hôm nay nắng đẹp quá, bệ cửa nhà bạn đúng là chỗ lý tưởng nhất để phơi nắng và ăn vặt!'],
    tap: ['Rộp rộp... Ngon tuyệt! Má tớ phồng lên như hai chiếc bánh bao rồi này!', 'Bạn trồng hoa khéo thật đấy, chú cúc họa mi kia cứ đung đưa theo gió trông vui mắt ghê.'],
    gift: 'Cảm ơn bữa ăn ngon lành nhé! Tớ nhặt được chiếc lá phong đỏ rực này ngoài công viên, tặng bạn làm kỷ niệm nè!' },
};
const vTap = {};
let vbubTimer;
function say(n, text, ms = 4200) {
  const v = VIS[n], b = $('#vbub'); if (!v) return;
  const l = parseFloat(v.el.style.left), w = parseFloat(v.el.style.width), t = parseFloat(v.el.style.top);
  const cx = l + w / 2, x = Math.min(74, Math.max(26, cx));
  b.textContent = text; b.style.left = x + '%'; b.style.top = t + '%';
  b.style.setProperty('--tail', `calc(50% + ${(cx - x) / 52 * 100}%)`);
  b.classList.add('show'); clearTimeout(vbubTimer); vbubTimer = setTimeout(() => b.classList.remove('show'), ms);
}
function sayTap(n) { const L = VLINES[n].tap; vTap[n] = ((vTap[n] ?? -1) + 1) % L.length; say(n, L[vTap[n]]); }
const IDLE = {
  frog: () => { SFX.croak(); bump(VIS.frog.el, 'hop'); },
  owl: () => { SFX.hoot(); bump(VIS.owl.el, 'tilt'); },
  squirrel: () => { SFX.chitter(); bump(VIS.squirrel.el, 'hop'); },
  sparrow: () => { SFX.chirp(); bump(VIS.sparrow.el, 'hop'); },
  plane: () => {},
};
function visitorAct(n) { IDLE[n](); VIS[n].next = perfT + rnd(12000, 25000); }
function arrive(n) {
  const v = VIS[n]; v.here = true; v.el.classList.remove('away'); v.el.classList.add('here');
  v.hit.style.display = ''; v.next = perfT + rnd(2500, 6000);
  if (n === 'sparrow') {
    SFX.flutter(); setTimeout(() => SFX.chirp(), 600);
    setTimeout(() => { if (v.here) { sparrowOn = false; leave('sparrow', true); scheduleSparrow(); } }, 50000);
  }
  if (n === 'owl') SFX.flutter();
  if (VLINES[n]) setTimeout(() => { if (v.here) say(n, VLINES[n].hi[Math.floor(Math.random() * 2)]); }, 1200);
  if (n === 'plane') {
    v.next = Infinity;
    if (AC) noiseBurst(AC.currentTime, 2.2, 500, 1600, 0.6, 0.12, master, 'pink');
    if (!reduceMotion) v.el.animate([
      { translate: '-430px -620px', rotate: '-25deg', opacity: 0 }, { opacity: 1, offset: 0.15 },
      { translate: '-160px -260px', rotate: '8deg', offset: 0.6 }, { translate: '0 0', rotate: '0deg', opacity: 1 }],
      { duration: 2600, easing: 'ease-out' });
    setTimeout(() => toast('Một chiếc máy bay giấy vừa đáp xuống bệ cửa ✈️', 2800), 2400);
  }
  if (n === 'squirrel') {
    v.stayUntil = perfT + 60000; setTimeout(() => SFX.chitter(), 500);
    setTimeout(() => {
      if (!v.here || S.food !== 'seeds') return;
      S.food = null; S.leaf = true; save(); applyFood(); bump(v.el, 'hop'); SFX.chitter();
      setTimeout(() => say('squirrel', VLINES.squirrel.gift, 5200), 5000);
    }, 3500);
  }
}
function leave(n, fly) {
  const v = VIS[n]; if (!v.here) return;
  if (VLINES[n] && VLINES[n].bye && !fly) say(n, VLINES[n].bye, 4500);
  v.here = false; v.hit.style.display = 'none'; v.el.classList.remove('here');
  if (fly) { v.el.classList.add('away'); if (n !== 'squirrel') SFX.flutter(); setTimeout(() => v.el.classList.remove('away'), 1400); }
}
function visitorTick() {
  updateCat();
  if (!started) return;
  for (const n of Object.keys(VIS)) {
    const v = VIS[n], w = want(n);
    if (w && !v.here) { if (!due[n]) due[n] = perfT + DELAY[n](); else if (perfT > due[n]) { due[n] = 0; arrive(n); } }
    if (!w) { due[n] = 0; if (v.here) { if (n === 'owl' && VLINES.owl.bye) say('owl', VLINES.owl.bye, 4500); leave(n, n !== 'frog'); } }
    if (v.here && perfT > v.next) visitorAct(n);
  }
}

// swipe across the chime rings it in the swipe direction
let swipe = null;
stage.addEventListener('pointerdown', e => { swipe = { x: e.clientX, y: e.clientY, t: performance.now() }; });
stage.addEventListener('pointermove', e => {
  if (!swipe) return;
  const r = stage.getBoundingClientRect(); const sx = (e.clientX - r.left) / scale, sy = (e.clientY - r.top) / scale;
  const b = HITS.chime.box;
  if (sx > b[0] && sx < b[0] + b[2] && sy > b[1] && sy < b[1] + b[3]) {
    const dx = e.clientX - swipe.x;
    if (Math.abs(dx) > 18) { pushChime(Math.sign(dx) * 150); swipe = null; }
  }
});
addEventListener('pointerup', () => { swipe = null; });

$('#mute').addEventListener('click', e => { e.stopPropagation(); openSound(); });
function setMuted(m) { S.muted = m; save(); applyMute(); if (AC) master.gain.setTargetAtTime(S.muted ? 0 : 0.42, AC.currentTime, 0.2); }
function openSound() {
  const sl = (id, label, v) => `<label class="vol"><span>${label}</span><input type="range" id="${id}" min="0" max="100" value="${Math.round(v * 100)}"></label>`;
  openPanel(`<h3>Âm thanh</h3>${sl('v-amb', '🌧️ Mưa, chim, côn trùng', S.volAmb)}${sl('v-radio', '📻 Nhạc radio', S.volRadio)}${sl('v-music', '🎵 Nhạc nền', S.volMusic ?? 0.7)}
    <button class="reply" id="v-mute">${S.muted ? '🔈 Bật lại âm thanh' : '🔇 Tắt hết âm thanh'}</button>
    <button class="reply" id="v-done" style="text-align:center">Xong</button>`, true);
  $('#v-amb').addEventListener('input', e => { S.volAmb = e.target.value / 100; save(); if (ambBus) ambBus.gain.setTargetAtTime(S.volAmb, AC.currentTime, 0.05); });
  $('#v-music').addEventListener('input', e => { S.volMusic = e.target.value / 100; save(); if (bgmBus) bgmBus.gain.setTargetAtTime(S.volMusic, AC.currentTime, 0.05); });
  $('#v-radio').addEventListener('input', e => { S.volRadio = e.target.value / 100; save(); if (radioVol) radioVol.gain.setTargetAtTime(S.volRadio, AC.currentTime, 0.05); });
  $('#v-mute').addEventListener('click', e => { e.stopPropagation(); setMuted(!S.muted); openSound(); });
  $('#v-done').addEventListener('click', e => { e.stopPropagation(); closeNote(); });
  $('#note').addEventListener('click', e => e.stopPropagation(), { once: true });
}
function applyMute() { $('#mute').style.backgroundImage = `url(${S.muted ? '{{PROP_snd_off}}' : '{{PROP_snd_on}}'})`; }
applyMute();

$('#intro').addEventListener('click', () => {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}   // iPhone: play even with the silent switch on
  // iPhone silent-switch unlock: loop a real 1-second silent clip (an empty clip on loop seeks thousands of times a second and freezes Chrome)
  if (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) try {
    const n = 8000, buf = new Uint8Array(44 + n), v = new DataView(buf.buffer), str = (o, t) => [...t].forEach((c, i) => buf[o + i] = c.charCodeAt(0));
    str(0, 'RIFF'); v.setUint32(4, 36 + n, true); str(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); str(36, 'data'); v.setUint32(40, n, true); buf.fill(128, 44);
    const a = new Audio(URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }))); a.loop = true; a.volume = 0.01; a.play().catch(() => {});
  } catch (e) {}
  initAudio(); if (AC.state === 'suspended') AC.resume();
  SFX.creak(); setTimeout(() => SFX.chime(0.6), 700);
  pushChime(110);
  $('#intro').classList.add('gone'); started = true; scheduleSparrow(true);
  setTimeout(() => toast('Chạm vào đồ vật để tương tác ✨', 3200), 1600);
});
document.addEventListener('visibilitychange', () => {
  if (!AC) return;
  if (document.hidden) AC.suspend(); else AC.resume();
});

// ---------------------------------------------------------------- main loop
let last = performance.now(), perfT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; perfT = now;
  stepChime(dt); stepSky(dt); stepFx(dt); visitorTick();
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize(); applyLook(); updatePlant(false); applyFood(); applyTea(); applyWallArt(); applyNaNote(); applyCandle(); applyChime(); applyLantern(); applyWelcome(); applyRings(); checkLights(); setInterval(growthCheck, 2000);
setInterval(() => {
  if (started && catPose === 'sleep' && Math.random() < 1 / 160) catAct('back', 25);   // now and then she sits and watches the alley
  applyNaNote(); if (started && !$('#note-wrap').classList.contains('show')) finaleCheck();
  if (S.story.na === 3 && !S.story.naWarm && S.weather === 'rain' && started && !naWetShown) {
    naWetShown = true; catSit(4); toast('Bánh Quy chạy về ướt nhẹp, run rẩy… chạm vào mèo để lau khô 🌧️', 3600);
  }
}, 1500);
requestAnimationFrame(frame);
</script>
