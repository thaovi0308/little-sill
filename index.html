  .bm-prev { position: sticky; top: -2.2em; z-index: 2; display: flex; justify-content: center; font-size: 11px; padding: 3.6em 0 1em; margin: 0 -1em; background: linear-gradient(var(--paper) 90%, rgba(253,248,238,0)); }
  .bm-row { display: flex; gap: .45em; flex-wrap: wrap; justify-content: center; margin: .3em 0 .6em; }
  .chip { border: 1.5px solid var(--paper-line); background: rgba(255,255,255,.55); border-radius: 999px; padding: .35em .75em; font: inherit; font-size: .9em; color: inherit; cursor: pointer; }
  .chip.on { background: #f6d98f; border-color: #c99a3c; }
  .chip:disabled { opacity: .45; }
  .chip img { height: 1.5em; vertical-align: middle; }
  .bm-grid { display: flex; flex-wrap: wrap; gap: .9em; justify-content: center; font-size: 6px; padding: 2.4em 0 .5em; }
  .bm-grid .bm { cursor: pointer; }
  #bm-tail { position: absolute; z-index: 6; border: 0; padding: 0; border-radius: 0 0 3px 3px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .hit { position: absolute; background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
    outline: none; }
  .hit:focus-visible { outline: 2px dashed rgba(255,255,255,.7); outline-offset: 2px; border-radius: 12px; }
  .prop { position: absolute; pointer-events: none; transform-origin: 50% 100%;
    filter: drop-shadow(0 3px 3px rgba(60,35,20,.28)); transition: filter .8s ease; }
  #p-chime { transform-origin: 50% 0%; filter: drop-shadow(0 2px 2px rgba(20,30,60,.25)); }
  #p-lamp.off { filter: drop-shadow(0 3px 3px rgba(60,35,20,.28)) brightness(.9) saturate(.7); }
  #p-radio.on { animation: bop var(--beat, .833s) ease-in-out infinite; }
  @keyframes bop { 0%,100% { transform: scale(1,1); } 12% { transform: scale(1.012,.985); } }
  .wiggle { animation: wiggle 1.1s ease-in-out; }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-3deg); } 45% { transform: rotate(2.2deg); }
    70% { transform: rotate(-1deg); } }
  .press { animation: press .35s ease; }
  @keyframes press { 40% { transform: scale(.95); } 75% { transform: scale(1.03); } }

  #wring { position: absolute; border-radius: 999px; pointer-events: none;
    box-shadow: 0 0 0 2px rgba(255,255,255,.95), 0 0 14px 3px rgba(255,236,190,.75);
    transition: left .5s cubic-bezier(.4,1.4,.6,1); }

  /* paper note */
  #note-wrap { position: absolute; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center;
    background: rgba(31,29,43,.35); opacity: 0; pointer-events: none; transition: opacity .4s ease; }
  #note-wrap.show { opacity: 1; pointer-events: auto; }
  #note { width: 78%; max-width: 420px; background: var(--paper); border-radius: 16px;
    border: 1.5px dashed var(--paper-line); padding: 7% 7% 6%; transform: translateY(14px) rotate(-1.2deg);
    transition: transform .5s cubic-bezier(.2,1.2,.4,1); box-shadow: 0 14px 40px rgba(40,25,10,.3);
    font-family: 'Patrick Hand', 'Quicksand', cursive; font-size: clamp(17px, calc(2.9 * var(--vh, 1vh)), 24px); line-height: 1.45;
    color: #5b4330; text-align: center; max-height: 88%; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
  #note-wrap.show #note { transform: translateY(0) rotate(-1.2deg); }
  #note small { display: block; margin-top: 1.1em; font-family: 'Quicksand', sans-serif; font-size: .62em;
    color: #a08a72; letter-spacing: .04em; }

  #vbub { position: absolute; z-index: 8; pointer-events: none; width: max-content; max-width: 52%; transform: translate(-50%, calc(-100% - 10px)) scale(.9); opacity: 0;
    background: rgba(255,250,240,.96); color: #5b4636; border-radius: 18px; padding: .55em .85em; font-size: clamp(12px, calc(1.8 * var(--vh, 1vh)), 16px); line-height: 1.4;
    box-shadow: 0 4px 14px rgba(40,25,10,.25); transition: opacity .35s, transform .35s; }
  #vbub::after { content: ''; position: absolute; left: var(--tail, 50%); bottom: -9px; border: 9px solid transparent; border-bottom: 0; border-top-color: rgba(255,250,240,.96); transform: translateX(-50%); }
  #vbub.show { opacity: 1; transform: translate(-50%, calc(-100% - 10px)) scale(1); }
  #vbub.below { transform: translate(-50%, 10px) scale(.9); } #vbub.below.show { transform: translate(-50%, 10px) scale(1); }
  #vbub.below::after { bottom: auto; top: -9px; border: 9px solid transparent; border-top: 0; border-bottom-color: rgba(255,250,240,.96); }
  #p-rope { position: absolute; height: 0; border-top: 1.5px solid rgba(110,80,50,.75); transform-origin: left center; transform: rotate(-7deg); opacity: 0; transition: opacity 1s; pointer-events: none; }
  #p-bag { position: absolute; opacity: 0; transition: opacity 1s, transform .6s; pointer-events: none; transform-origin: 50% 0; animation: bagSway 4s ease-in-out infinite; }
  #p-bag img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 3px 4px rgba(40,25,10,.3)); }
  #p-bag::after { content: ''; position: absolute; left: 30%; bottom: 14%; width: 38%; height: 22%; border-radius: 3px; background: #fff7e6; box-shadow: 0 1px 3px rgba(40,25,10,.35); transform: rotate(-14deg); opacity: 0; transition: opacity .6s; }
  #p-rope.on, #p-bag.on { opacity: 1; }
  #p-bag.mail::after { opacity: 1; }
  @keyframes bagSway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  #petals { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
  #petals i { position: absolute; top: -40px; width: calc(18px * var(--s)); height: calc(14px * var(--s)); border-radius: 80% 10% 80% 10%;
    background: radial-gradient(circle at 30% 30%, #ffd3e2, #f39ab8 70%); opacity: .85; animation: petal linear forwards; }

  #bks > img { transition: opacity .5s; }
  #bks .hit { z-index: 2; }
  #bks::after { content: ''; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; transition: background-color 1.2s ease; }
  #bks[data-w="night"]::after { background-color: rgba(80,70,120,.45); }
  #bks[data-w="rain"]::after { background-color: rgba(150,155,180,.3); }
  .bks-glow { position: absolute; inset: 0; pointer-events: none; z-index: 1; mix-blend-mode: screen; transition: opacity .6s ease; opacity: .55;
    background: radial-gradient(22% 13% at 17% 66%, rgba(255,226,150,.85), rgba(255,226,150,0)); }
  #bks[data-w="night"] .bks-glow, #bks[data-w="rain"] .bks-glow { opacity: 1; }
  #bks.lamp-off .bks-glow { opacity: 0; }
  .bk-dust { opacity: 0; transition: opacity .8s; border-radius: 30%; background: radial-gradient(closest-side, rgba(255,250,230,.0), rgba(255,250,230,0)); }
  .bk-dust.on { opacity: 1; animation: spotGlow 2.2s ease-in-out infinite; box-shadow: 0 0 0 3px rgba(249,199,79,.35); }
  .bk-dust.on::after { content: '✨'; position: absolute; right: 2%; top: -14%; font-size: clamp(14px, calc(2.4 * var(--vh, 1vh)), 22px); animation: breathe 2s ease-in-out infinite; }
  #bks-say { top: 58%; }
  #bks-acts { position: absolute; left: 0; right: 0; bottom: 9.6%; display: flex; justify-content: center; gap: 3%; z-index: 3; flex-wrap: wrap; }
  #bks-acts button { border: 1.5px solid #C9A982; border-radius: 999px; padding: .5em 1.1em; background: rgba(253,248,238,.96); color: #4A3525; cursor: pointer;
    font: 600 clamp(13px, calc(2 * var(--vh, 1vh)), 16px) 'Quicksand', sans-serif; box-shadow: 0 3px 8px rgba(30,20,10,.25); animation: spotGlow 1.8s ease-in-out infinite; }
  #bksort { position: absolute; inset: 0; z-index: 12; display: flex; align-items: center; justify-content: center; background: rgba(31,29,43,.45);
    opacity: 0; pointer-events: none; transition: opacity .35s ease; }
  #bksort.show { opacity: 1; pointer-events: auto; }
  .bs-card { width: 92%; max-width: 420px; background: var(--paper); border: 2px solid #C9A982; border-radius: 20px; padding: 1em 1em .8em; text-align: center;
    box-shadow: 0 14px 40px rgba(40,25,10,.35); font-family: 'Quicksand', sans-serif; color: var(--ink); }
  .bs-card h4 { margin: 0 0 .2em; font: 600 1.05em 'Lora', serif; }
  .bs-card > small { display: block; color: #7a6250; margin-bottom: .7em; }
  .bs-shelf { position: relative; height: clamp(150px, calc(26 * var(--vh, 1vh)), 230px); background: linear-gradient(#6b4a30, #5a3d27); border-radius: 10px; padding: 8% 4% 0;
    box-shadow: inset 0 6px 14px rgba(0,0,0,.35); }
  #bs-row { position: relative; height: 86%; display: flex; align-items: flex-end; justify-content: center; gap: 2%; touch-action: none; }
  .bs-b { height: 90%; width: auto; cursor: grab; user-select: none; -webkit-user-select: none; transition: transform .2s ease; filter: drop-shadow(2px 2px 2px rgba(0,0,0,.35)); }
  .bs-b.lift { transition: none; cursor: grabbing; z-index: 2; position: relative; filter: drop-shadow(4px 8px 6px rgba(0,0,0,.4)); }
  .bs-b.sel { transform: translateY(-12px); filter: drop-shadow(0 0 6px rgba(249,199,79,.95)); }
  .bs-guide { position: absolute; left: 4%; right: 4%; bottom: 0; height: 14%; border-radius: 0 0 8px 8px;
    background: linear-gradient(90deg, #c8473d, #df8a3c, #d9a441, #e3c95a, #6f9a5b, #9bb08f, #5f86b0, #8a6447); opacity: .55; }
  .bs-card .reply { margin-top: .8em; }
  #p-bkbook { transition: opacity .6s; transform: rotate(-84deg); transform-origin: 50% 50%; filter: drop-shadow(2px 3px 2px rgba(60,40,20,.35)); }
  .bk-alb { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5em; margin: .4em 0 .8em; }
  .bk-alb > div { background: #fbf4e4; border: 1px solid #e3d3b3; border-radius: 8px; padding: .4em .2em; text-align: center; font-size: .8em; }
  .bk-alb img { height: 3.6em; width: 100%; object-fit: contain; display: block; }
  .bk-alb b, .bk-alb small { display: block; } .bk-alb small { color: #8a7560; font-size: .85em; }
  .bk-alb .empty span { display: block; height: 3.6em; line-height: 3.6em; font: 1.4em 'Patrick Hand', cursive; color: #cdbb9a; }
  .spot-b.books img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 3px 4px rgba(60,35,20,.3)); }
  #fade { position: absolute; inset: 0; background: #1f1a14; opacity: 0; pointer-events: none; transition: opacity .4s ease; z-index: 15; }
  #fade.on { opacity: 1; pointer-events: auto; }
  #shop { position: absolute; inset: 0; z-index: 7; display: none; background: center / 100% 100% no-repeat; overflow: hidden; }
  #shop.show { display: block; animation: fadeIn .4s ease; }
  #shop > img, #shop .spot { position: absolute; pointer-events: none; }
  #shop .spot { background-repeat: no-repeat; transition: filter 1.2s ease; -webkit-mask-image: radial-gradient(closest-side, #000 70%, transparent); mask-image: radial-gradient(closest-side, #000 70%, transparent); }
  #shop .spot.dry { filter: saturate(.25) sepia(.45) brightness(.92); }
  #shop .spr { position: absolute; pointer-events: none; background: center bottom / contain no-repeat; opacity: 0; transition: opacity .6s ease; transform-origin: 50% 100%; }
  #shop .spr.on { opacity: 1; }
  #shop .spr.dry::after { content: '💧'; position: absolute; left: 50%; top: 4%; transform: translateX(-50%); font-size: clamp(10px, calc(1.8 * var(--vh, 1vh)), 16px); animation: breathe 2s ease-in-out infinite; }
  #shop .hit { z-index: 2; }
  #shop::after { content: ''; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; transition: background-color 1.2s ease; }
  #shop[data-w="night"]::after { background-color: rgba(70,70,125,.55); }
  #shop[data-w="rain"]::after { background-color: rgba(160,168,196,.38); }
  .shop-glow { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; z-index: 1; mix-blend-mode: screen;
    background: radial-gradient(9% 6% at 5% 27%, rgba(249,199,79,.9), rgba(249,199,79,0)), radial-gradient(9% 6% at 94% 27%, rgba(249,199,79,.9), rgba(249,199,79,0)),
      radial-gradient(40% 18% at 50% 30%, rgba(255,210,140,.35), rgba(255,210,140,0)); }
  #shop[data-w="night"] .shop-glow, #shop[data-w="rain"] .shop-glow { opacity: 1; }
  .shop-rain { position: absolute; left: 0; right: 0; top: 0; height: 22%; pointer-events: none; opacity: 0; z-index: 1;
    background: repeating-linear-gradient(105deg, rgba(220,230,255,0) 0 9px, rgba(220,230,255,.45) 9px 10px); background-size: 60px 60px; animation: rainfall .5s linear infinite; }
  #shop[data-w="rain"] .shop-rain { opacity: 1; }
  @keyframes rainfall { to { background-position: -12px 60px; } }
  /* guide review 28/11: the shop's weather switch is a small pill in the corner, so the awning and bougainvillea stay visible */
  .shop-top { position: absolute; right: 3%; top: 1.4%; display: flex; gap: 4%; width: 34%; z-index: 3; padding: 1.2% 1.6%; border-radius: 999px; background: rgba(253,248,238,.55); box-shadow: 0 1px 6px rgba(74,53,37,.18); }
  .sw { flex: 1; border: 0; padding: 0; background: none; cursor: pointer; border-radius: 40%; }
  .sw img { width: 100%; display: block; }
  .sw.on { box-shadow: 0 0 0 3px rgba(255,255,255,.85); }
  .shop-bar { position: absolute; left: 0; right: 0; bottom: 2.4%; display: flex; justify-content: center; gap: 4%; z-index: 3; }
  .shop-bar button { border: 0; border-radius: 999px; padding: .6em 1.3em; font: 600 clamp(13px, calc(2.1 * var(--vh, 1vh)), 17px) 'Quicksand', sans-serif; cursor: pointer; box-shadow: 0 3px 8px rgba(30,20,10,.3); }
  .shop-bar .sb-ic { width: 1.7em; height: 1.7em; vertical-align: middle; margin: -.5em .35em -.45em -.7em; border-radius: 50%; }
  .shop-bar .sb { background: #4A3525; color: #FDF8EE; } .shop-bar .sb2 { background: #FDF8EE; color: #4A3525; }
  #shop-say, #bks-say { position: absolute; left: 7%; right: 7%; top: 67%; z-index: 4; background: rgba(253,248,238,.96); border-radius: 18px; padding: .8em 1em;
    font: clamp(14px, calc(2.2 * var(--vh, 1vh)), 18px)/1.45 'Patrick Hand', cursive; color: #5b4330; box-shadow: 0 6px 18px rgba(40,25,10,.25); border: 1.5px solid #C9A982;
    opacity: 0; transform: translateY(8px); transition: opacity .35s, transform .35s; pointer-events: none; }
  #shop-say.show, #bks-say.show { opacity: 1; transform: none; pointer-events: auto; }
  #shop-say::after, #bks-say::after { content: ''; position: absolute; left: 62%; top: -10px; border: 10px solid transparent; border-top: 0; border-bottom-color: rgba(253,248,238,.96); }
  #shop-say small, #bks-say small { display: block; font-size: .75em; }
  /* guide review 28/11: picture + name on top, description, care tip and button use the full card width (the text column was too narrow) */
  .trade { display: grid; grid-template-columns: 3.6em 1fr; column-gap: .8em; align-items: center; border: 1.5px solid var(--paper-line); background: #fffdf7; border-radius: 12px; padding: .7em .8em; margin: .5em 0; }
  .trade > img { width: 3.6em; height: auto; object-fit: contain; grid-row: 1 / 3; }
  .trade > div { display: contents; } .trade b { grid-column: 2; align-self: end; } .trade .cost { grid-column: 2; align-self: start; }
  .trade p, .trade .care, .trade .reply { grid-column: 1 / -1; }
  .trade b { display: block; } .trade p { margin: .3em 0; font-size: .86em; line-height: 1.4; }
  .trade .cost { display: block; color: #c9772f; font-size: .85em; font-weight: 600; } .trade .care { display: block; color: #8a735c; font-size: .8em; }
  .trade .reply { text-align: center; } .trade .reply[disabled] { opacity: .6; cursor: default; } .trade .reply[data-no] { opacity: .75; }
  #beam { position: absolute; width: 46%; height: 5%; transform-origin: 0 50%; pointer-events: none; opacity: 0; z-index: 1; transition: opacity 1.5s;
    background: linear-gradient(to right, rgba(255,232,160,.55), rgba(255,232,160,0)); clip-path: polygon(0 45%, 100% 0, 100% 100%, 0 55%); mix-blend-mode: screen; }
  #beam.on { opacity: 1; animation: sweep 9s ease-in-out infinite; }
  @keyframes sweep { 0%,100% { transform: translateY(-50%) rotate(195deg); } 50% { transform: translateY(-50%) rotate(235deg); } }
  #p-plant2, #p-lighthouse { transition: opacity .6s; }
  .album { display: grid; grid-template-columns: 1fr 1fr; gap: .7em; }
  .alb { border: 0; background: none; padding: 0; cursor: pointer; font: inherit; color: inherit; text-align: center; }
  .alb > span { display: block; position: relative; aspect-ratio: 3 / 2; border-radius: 4px; overflow: hidden; box-shadow: 0 3px 8px rgba(60,35,20,.25); transform: rotate(-1.5deg); }
  .alb:nth-child(even) > span { transform: rotate(1.5deg); }
  .alb > span > img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .alb b { display: block; font-size: .78em; font-weight: 600; margin-top: .35em; line-height: 1.3; }
  @media (prefers-reduced-motion: reduce) {
    #beam.on, #mb-fly, .shop-rain { animation: none !important; }
    #p-radio.on, .wiggle, .press, #intro .tap { animation: none !important; }
  }

let AC = null, master, reverb, amb = {}, radioBus, ambBus, radioVol;
function makeNoise(seconds, kind) {
  const len = Math.floor(AC.sampleRate * seconds), buf = AC.createBuffer(2, len, AC.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch); let last = 0, b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < len; i++) {
      const white = Math.random() * 2 - 1;
      if (kind === 'brown') { last = (last + 0.02 * white) / 1.02; d[i] = last * 3.5; }
      else if (kind === 'pink') { b0 = 0.997 * b0 + white * 0.029591; b1 = 0.985 * b1 + white * 0.032534;
        b2 = 0.95 * b2 + white * 0.048056; d[i] = (b0 + b1 + b2 + white * 0.05) * 1.6; }
      else d[i] = white;
    }
    if (kind === 'brown') { let m = 0; for (let i = 0; i < len; i++) m += d[i]; m /= len; for (let i = 0; i < len; i++) d[i] -= m; }
    const X = Math.floor(AC.sampleRate * 0.8);   // the end fades into the start, so the loop has no click
    for (let i = 0; i < X; i++) { const a = i / X; d[i] = d[i] * a + d[len - X + i] * (1 - a); }
  }
  const out = AC.createBuffer(2, len - Math.floor(AC.sampleRate * 0.8), AC.sampleRate);
  for (let ch = 0; ch < 2; ch++) out.copyToChannel(buf.getChannelData(ch).subarray(0, out.length), ch);
  return out;
}
function makeImpulse(seconds, decay) {
  const len = Math.floor(AC.sampleRate * seconds), buf = AC.createBuffer(2, len, AC.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  return buf;
}

const BPM = 72, BEAT = 60 / BPM;

const PROG = [

  { root: 38, notes: [57, 60, 64, 65] },

    ch.notes.forEach((m, k) => epiano(t + k * 0.018 + Math.random() * 0.01, m, BEAT * 3.8, 0.8 + Math.random() * 0.2));
    bass(t, ch.root, BEAT * 1.4);
  }
  if (beat === 2) bass(t + BEAT * 0.5, ch.root + 12 * (Math.random() < 0.3 ? 1 : 0), BEAT * 1.1);
  if (beat === 0 || (beat === 2 && Math.random() < 0.8)) kick(t);

    epiano(t + (Math.random() < 0.5 ? 0 : BEAT * 0.5 + swing), m, BEAT * 2, 0.55);
  }

  for (let k = 0; k < 3; k++) if (Math.random() < 0.5)

function playMusicBox() {
  if (!AC) return;
  const mel = [76, 79, 84, 83, 81, 79, 76, 0, 77, 81, 86, 84, 83, 79, 0, 0, 76, 79, 84, 88, 86, 84, 81, 0, 77, 76, 74, 79, 72, 0, 0, 0];
  let t = AC.currentTime + 0.1;
  mel.forEach((m, k) => {
    const step = 0.34 + (k > 27 ? (k - 27) * 0.06 : 0);
    if (m) { const f = midi(m); tone(t, f, 1.3, 0.09, 'sine', reverb); tone(t, f, 1.1, 0.06); tone(t, f * 3, 0.35, 0.012); }
    t += step;
  });
}
function waves() {
  if (!AC) return; const t = AC.currentTime;
  for (let k = 0; k < 4; k++) noiseBurst(t + k * 1.7, 2.2, 300, 900, 0.4, 0.16, master, 'brown');
}

function candleTick() {

  const left = S.candleAt + focusMs() - Date.now();
  if (left <= 0) {
    S.incense = false; S.candleAt = 0; S.candleDone = (S.candleDone || 0) + 1; save(); applyCandle(); el.style.display = 'none';
    SFX.chime(0.8); setTimeout(() => SFX.chime(0.5), 900);
    const pool = ['daisy', 'daisy', 'lavender', 'lavender', 'cactus', 'fern', 'pothos'], st = S.story;
    const need = st.na === 1 && !st.naSent && !(S.keep.daisy > 0) ? 'daisy' : floNeedsSprig() ? 'lavender' : null;   // Vi 26/11: never leave a route stuck
    const k = need || pool[Math.floor(Math.random() * pool.length)], mins = S.focusMin || 25, fd = focusDone();

      <small>Phần thưởng: ${mins >= 45 ? 'hai phần ' : ''}${PLANTS[k].gift.toLowerCase()} đã vào hộp kỷ vật</small>`);

  }

}

function petals(n) {
  const box = document.createElement('div'); box.id = 'petals'; document.body.appendChild(box);

}
function naChapter() {

  if (st.na === 2) return now - st.naAt >= 12 * HOUR ? 2 : null;
  if (st.na === 3) return st.naWarm && now - st.naWarm >= 0.5 * HOUR && S.weather !== 'rain' ? 3 : null;

}

    const v = VIS[n], w = want(n);
    if (w && !v.here) { if (!due[n]) due[n] = perfT + DELAY[n](); else if (perfT > due[n]) { due[n] = 0; arrive(n); } }
    if (!w) { due[n] = 0; if (v.here) { if (n === 'owl' && VLINES.owl.bye) say('owl', VLINES.owl.bye, 4500); leave(n, n !== 'frog'); } }
    if (v.here && perfT > v.next) visitorAct(n);
  }
}

// swipe across the chime rings it in the swipe direction
let swipe = null;
stage.addEventListener('pointerdown', e => { swipe = { x: e.clientX, y: e.clientY, t: performance.now() }; });
stage.addEventListener('pointermove', e => {
  if (!swipe) return;
  const r = stage.getBoundingClientRect(); const sx = (e.clientX - r.left) / scale, sy = (e.clientY - r.top) / scale;
  const b = HITS.chime.box;
  if (sx > b[0] && sx < b[0] + b[2] && sy > b[1] && sy < b[1] + b[3]) {
    const dx = e.clientX - swipe.x;
    if (Math.abs(dx) > 18) { pushChime(Math.sign(dx) * 150); swipe = null; }
  }
});
addEventListener('pointerup', () => { swipe = null; });

$('#intro').addEventListener('click', () => {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}   // iPhone: play even with the silent switch on
  // iPhone silent-switch unlock: loop a real 1-second silent clip (an empty clip on loop seeks thousands of times a second and freezes Chrome)
  if (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) try {
    const n = 8000, buf = new Uint8Array(44 + n), v = new DataView(buf.buffer), str = (o, t) => [...t].forEach((c, i) => buf[o + i] = c.charCodeAt(0));
    str(0, 'RIFF'); v.setUint32(4, 36 + n, true); str(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); str(36, 'data'); v.setUint32(40, n, true); buf.fill(128, 44);
    const a = new Audio(URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }))); a.loop = true; a.volume = 0.01; a.play().catch(() => {});
  } catch (e) {}
  initAudio(); if (AC.state === 'suspended') AC.resume();
  SFX.creak(); setTimeout(() => SFX.chime(0.6), 700);
  pushChime(110);
  $('#intro').classList.add('gone'); started = true; scheduleSparrow(true);
  setTimeout(() => toast('Chạm vào đồ vật để tương tác ✨', 3200), 1600);
});
document.addEventListener('visibilitychange', () => {
  if (!AC) return;
  if (document.hidden) AC.suspend(); else AC.resume();
});

let last = performance.now(), perfT = 0;
// ================================================================ "Ra ngoài hẻm" (Vi 26/11): alley map, mailbox under the stairs (route 5: Minh), the florist's shop, a 2nd pot
// state
S.born = S.born || Date.now();
S.story.minh = S.story.minh || 0;
S.seedsGot = S.seedsGot || {};
S.shop = Object.assign({ visited: 0, helpDay: '', helpN: 0, pots: null, potsDay: '', chat: 0 }, S.shop || {});
S.radioCh = S.radioCh || 'fm';
const dayN = () => (Date.now() - S.born) / (24 * HOUR);
const forceMap = /[?&]hem\b/.test(location.search);   // testing: ?hem opens the alley map at once
function mapOpen() { return forceMap || (S.story.flower || 0) >= 2 || dayN() >= 1 || S.story.minh > 0; }
function routeDone() { const st = S.story; return st.plane >= 5 || st.na >= 5 || (st.flower || 0) >= 5 || !!st.sparrowCh5 || (st.khai || 0) >= 5 || (st.hanh || 0) >= 5; }

// ---------- audio: the map / mailbox keep the room sound a little lower; the shop has its own air
let duckLevel = 1;
function duck(v, t = 0.8) {
  duckLevel = v; if (!AC) return;
  master.gain.cancelScheduledValues(AC.currentTime);
  master.gain.setTargetAtTime(S.muted ? 0 : 0.42 * v, AC.currentTime, t / 3);
}
function footsteps() {   // soft footsteps on brick
  if (!AC) return; const t = AC.currentTime;
  for (let i = 0; i < 4; i++) noiseBurst(t + i * 0.32 + Math.random() * 0.04, 0.07, 160 + Math.random() * 80, 0, 1.2, 0.18, master, 'brown');
}
let shopAir = null;
function shopAudio(on) {
  if (!AC) return;
  const now = AC.currentTime;
  radioVol.gain.cancelScheduledValues(now); radioVol.gain.setTargetAtTime(on ? 0 : S.volRadio, now, 0.27);
  if (bgmBus) { bgmBus.gain.cancelScheduledValues(now); bgmBus.gain.setTargetAtTime(on ? 0 : (S.volMusic ?? 0.7), now, 0.27); }
  if (on) {
    setAmbience(S.weather === 'rain' ? 'rain' : 'sunset', 2.4);   // street air: sparrows (or the rain on the awning)
    clearInterval(shopAir); shopAir = setInterval(() => { if (Math.random() < 0.5) SFX.chime(0.12); else if (S.weather !== 'night') SFX.chirp(); }, 6500);
  } else { clearInterval(shopAir); shopAir = null; setAmbience(S.weather, 2.4); }
}

// ---------- the map button (top right) and the butterfly that says where to go
const mapBtn = $('#mapbtn');
function mailNews() { return minhReady() !== null; }
function shopNews() { return mapOpen() && (!S.shop.visited || shopPotsLeft() > 0); }
let mapShownOnce = !!S.mapSeen;
function applyMapBtn() {
  const open = mapOpen();
  mapBtn.style.display = open ? '' : 'none';
  if (open && !mapShownOnce && started) { mapShownOnce = true; S.mapSeen = 1; save(); bump(mapBtn); toast('Có lối xuống hẻm rồi 🗺️ Chạm nút bản đồ ở góc trên để ra ngoài dạo nhé', 4200); }
  mapBtn.classList.toggle('news', open && (mailNews() || shopNews()));
}
mapBtn.addEventListener('click', e => { e.stopPropagation(); openMap(); });

// ---------- alley map popup
function openMap() {
  if (!AC) initAudio();
  duck(0.7); SFX.paper();
  const m = $('#amap');
  m.querySelector('[data-go="mail"]').classList.toggle('news', mailNews());
  m.querySelector('[data-go="shop"]').classList.toggle('news', shopNews());
  m.classList.add('show');
}
function closeMap() { $('#amap').classList.remove('show'); duck(1); }
$('#amap').addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (!b) { if (e.target.id === 'amap') closeMap(); return; }
  e.stopPropagation();
  if (b.dataset.go === 'home') { closeMap(); SFX.click(); }
  if (b.dataset.go === 'mail') openMailbox();
  if (b.dataset.go === 'shop') enterShop();
});

let pineSrc = null;
function pineBed(on) {
  if (!AC) return;
  if (pineSrc) { const old = pineSrc; pineSrc = null; old.g.gain.setTargetAtTime(0, AC.currentTime, 0.4); setTimeout(() => old.s.forEach(x => x.stop()), 2000); }
  if (!on) return;
  const g = gain(0); g.connect(radioBus); const s = [];
  for (const [n, v] of [['amb_rain', 0.9], ['amb_day', 0.5]]) if (BUF[n]) {
    const b = AC.createBufferSource(); b.buffer = BUF[n]; b.loop = true; chain(b, gain(v), g); b.start(0, Math.random() * BUF[n].duration); s.push(b);
  }
  g.gain.setTargetAtTime(1, AC.currentTime + 0.4, 0.6); pineSrc = { g, s };
}

  if (AC) noiseBurst(AC.currentTime, 0.4, 900, 2600, 0.6, 0.1);

// ---------- daily shelf: drag (or tap two) books into spine-colour order; it cannot go wrong, it only has to end sorted
let bsOrder = [], bsSel = -1, bsDrag = null, bsDone = false;
function openSort() {
  if (!AC) initAudio();
  const pick = BK_ORDER.slice().sort(() => Math.random() - 0.5).slice(0, 6);
  do pick.sort(() => Math.random() - 0.5); while (bsSorted(pick));
  bsOrder = pick; bsSel = -1; bsDone = false; bsRender();
  $('#bksort').classList.add('show'); bkThump(0.6);
}
function bsSorted(a) { return a.every((c, i) => !i || BK_ORDER.indexOf(a[i - 1]) < BK_ORDER.indexOf(c)); }
function bsRender() {
  $('#bs-row').innerHTML = bsOrder.map((c, i) => `<img class="bs-b${i === bsSel ? ' sel' : ''}" data-i="${i}" src="${ITEM_IMG['book_' + c]}" alt="Sách gáy ${c}" draggable="false" style="height:${(BK_BOOK_H[c] / 272 * 100).toFixed(1)}%">`).join('');
}
const bsRow = $('#bs-row');
bsRow.addEventListener('pointerdown', e => {
  const b = e.target.closest('.bs-b'); if (!b || bsDone) return;
  e.preventDefault(); bsDrag = { b, i: +b.dataset.i, x0: e.clientX, moved: false };
  try { b.setPointerCapture(e.pointerId); } catch (_) {}
  b.classList.add('lift'); bkThump(0.35);
});
bsRow.addEventListener('pointermove', e => {
  if (!bsDrag) return; const dx = e.clientX - bsDrag.x0;
  if (Math.abs(dx) > 6) bsDrag.moved = true;
  bsDrag.b.style.transform = `translate(${dx}px, -10px) rotate(${Math.max(-8, Math.min(8, dx / 12))}deg)`;
});
function bsDrop(e) {
  if (!bsDrag) return; const { b, i, moved } = bsDrag; bsDrag = null;
  if (!moved) {
    if (bsSel < 0) { bsSel = i; bsRender(); return; }
    if (bsSel !== i) { [bsOrder[bsSel], bsOrder[i]] = [bsOrder[i], bsOrder[bsSel]]; bkThump(0.7); }
    bsSel = -1; bsRender(); bsCheck(); return;
  }
  const r = b.getBoundingClientRect(), cx = r.left + r.width / 2;
  const others = [...bsRow.querySelectorAll('.bs-b')].filter(x => x !== b);
  let to = others.filter(x => { const q = x.getBoundingClientRect(); return q.left + q.width / 2 < cx; }).length;
  const c = bsOrder.splice(i, 1)[0]; bsOrder.splice(to, 0, c);
  bsSel = -1; bkThump(0.7); bsRender(); bsCheck();
}
bsRow.addEventListener('pointerup', bsDrop);
bsRow.addEventListener('pointercancel', bsDrop);
function bsCheck() {
  if (!bsSorted(bsOrder)) return;
  bsDone = true; SFX.sparkle();
  bsRow.querySelectorAll('.bs-b').forEach((b, k) => setTimeout(() => { bump(b, 'hop'); bkTone(520 + k * 90, 0.18, 0.025, 'triangle'); }, k * 110));
  setTimeout(() => { $('#bksort').classList.remove('show'); sortDone(); }, 1500);
}
$('#bksort').addEventListener('click', e => {
  e.stopPropagation();
  if (e.target.id === 'bksort' || e.target.closest('#bs-x')) { $('#bksort').classList.remove('show'); SFX.click(); }
});

function bkBorrow() {
  if (S.story.khai < 1) { bkSay(KHAI.ch1[1]); return; }
  if (S.bk.loan) { bkSay(KHAI.reading); return; }
  if (S.bk.wantFlower) { bkFlowerPick(); return; }
  if (S.bk.sortDay !== dayKey() && S.story.khai < 5) { bkSay(KHAI.needSort); return; }
  const n = S.bk.loans % BOOKS.length;
  S.bk.loan = { n, pages: 0, readDay: '' }; S.bk.loans++; save(); applyBk(); applyBkBook(); applyMapBtn();
  bkThump(1); bkPage();
  bkSay(S.story.khai >= 5 ? KHAI.gold : KHAI.borrow);
  setTimeout(() => toast(`Mượn cuốn “${BOOKS[n].t}” 📖 Ông Khải đã đặt sẵn trên bàn ở gác, mỗi ngày đọc một trang nhé`, 4400), 1800);
}

      `<img class="paper-img" src="${ITEM_IMG.bk_daisy}" alt="" style="max-height:5em"> <img class="paper-img" src="${ITEM_IMG.bk_note}" alt="" style="max-height:5em"><small>Đã cất vào hộp kỷ vật. Mang sách xuống trả ông Khải nhé.</small></div>`
      : L.pages >= 3 ? '<small>Đọc xong rồi. Ra bản đồ, mang sách xuống trả ông Khải nhé 📚</small>' : '<small>Mai đọc tiếp trang sau nhé.</small>'), null, daisy);
  if (daisy) { S.keep.bk_daisy = 1; save(); stageReveal(false); setTimeout(() => SFX.sparkle(), 300); }
}
function bkReturn() {
  const L = S.bk.loan; if (!L || L.pages < 3) { bkSay(KHAI.reading); return; }

    const x = rnd(300, 470), y = rnd(175, 255), col = ['255,214,110', '255,140,120', '255,190,220', '255,240,200'][Math.floor(Math.random() * 4)];
    for (let i = 0; i < 26; i++) { const a = i / 26 * 6.283, v = rnd(14, 26); FW.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: rnd(1.3, 1.9), col }); }
    if (AC && !S.muted) setTimeout(() => noiseBurst(AC.currentTime, 0.5, 260, 120, 1.2, 0.03, ambBus || master, 'brown'), 700);
  }
  for (let i = FW.length - 1; i >= 0; i--) {

// A friend's window travels as a short text code (gzip + base64url), or inside a link ?ghe=<code>. No server, no account.
const FV_PREFIX = 'BCN1.';
const b64u = buf => { let s = ''; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };

function myWindow() {
  const pk = g => g && g.type && PLANT_IMG[g.type + g.stage] ? g.type + g.stage : null;
  return { v: 1, n: (S.fvName || '').slice(0, 24), m: (S.fvMsg || '').slice(0, 160), w: S.weather, c: S.chimeType, cu: S.decor.curtain || null, g: S.decor.garland || null, k: S.decor.cat || null,
    p: [pk(S.garden), S.garden2 === undefined ? null : pk(S.garden2) || 'empty0'], d: Object.keys(S.daysPlayed || {}).length };
}
async function windowCode() {
  const bytes = new TextEncoder().encode(JSON.stringify(myWindow()));
  try { return FV_PREFIX + b64u(new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer())); }
  catch (e) { return 'BCN0.' + b64u(bytes); }
}
async function readWindow(code) {
  code = String(code).trim(); const m = code.match(/[?&]ghe=([\w.-]+)/); if (m) code = m[1];
  code = code.replace(/\s+/g, ''); let bytes;
  if (code.startsWith('BCN0.')) bytes = unb64u(code.slice(5));
  else if (code.startsWith(FV_PREFIX)) bytes = new Uint8Array(await new Response(new Blob([unb64u(code.slice(FV_PREFIX.length))]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  else throw new Error('code');
  const d = JSON.parse(new TextDecoder().decode(bytes));
  if (!d || d.v !== 1) throw new Error('code');
  const str = (x, n) => typeof x === 'string' ? x.slice(0, n) : '';
  return { n: str(d.n, 24), m: str(d.m, 160), w: ['sunset', 'rain', 'night'].includes(d.w) ? d.w : 'sunset', c: CHIMES[d.c] ? d.c : 'glass',

// ---------- backup / restore: the progress lives only in this browser
const BK_PREFIX = 'BKCN1:';
async function backupCode() {
  const json = JSON.stringify(S);
  try {
    const gz = new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));
    const buf = new Uint8Array(await new Response(gz).arrayBuffer());
    let bin = ''; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    return BK_PREFIX + btoa(bin);
  } catch (e) { return 'BKCN0:' + btoa(unescape(encodeURIComponent(json))); }
}
async function readBackup(code) {
  code = code.replace(/\s+/g, '');
  if (code.startsWith('BKCN0:')) return JSON.parse(decodeURIComponent(escape(atob(code.slice(6)))));
  if (!code.startsWith(BK_PREFIX)) throw new Error('code');
  const bin = atob(code.slice(BK_PREFIX.length)), buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  const text = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(text);
}

// ---------- postcard: a picture of the window right now + a line from the notebook, to share
function sceneSnapshot() {
  const st = $('#stage'), r0 = st.getBoundingClientRect(), k = SW / r0.width;
  const c = document.createElement('canvas'); c.width = SW * 1.5; c.height = SH * 1.5;
  const ctx = c.getContext('2d'); ctx.scale(1.5 * k, 1.5 * k);
  const visible = el => { const cs = getComputedStyle(el); return cs.display !== 'none' && cs.visibility !== 'hidden' && parseFloat(cs.opacity) > 0.02 && el.offsetParent !== null; };
  const draw = (el, alpha = 1) => {
    const r = el.getBoundingClientRect(); if (r.width < 1 || r.height < 1) return;
    ctx.globalAlpha = alpha * parseFloat(getComputedStyle(el).opacity || 1);
    try { ctx.drawImage(el, r.left - r0.left, r.top - r0.top, r.width, r.height); } catch (e) {}
  };
  for (const el of st.querySelectorAll('img.scene')) if (visible(el)) draw(el);
  // the sky canvas is masked to the window in CSS: apply the same mask here
  const sky = $('#sky'), m = (getComputedStyle(st).getPropertyValue('--sky').match(/url\(["']?(.*?)["']?\)$/) || [])[1];
  if (sky && m && SKY_MASK_IMG.complete) {
    const t = document.createElement('canvas'); t.width = sky.width; t.height = sky.height; const tc = t.getContext('2d');
    tc.drawImage(sky, 0, 0); tc.globalCompositeOperation = 'destination-in'; tc.drawImage(SKY_MASK_IMG, 0, 0, t.width, t.height);
    ctx.globalAlpha = 1; ctx.drawImage(t, 0, 0, r0.width, r0.height);
  }
  for (const el of st.querySelectorAll('img.prop, #p-bag img')) if (visible(el)) draw(el);
  ctx.globalAlpha = 1; const fx = $('#fx'); if (fx) ctx.drawImage(fx, 0, 0, r0.width, r0.height);
  return c;
}
const SKY_MASK_IMG = new Image();
SKY_MASK_IMG.src = ((getComputedStyle($('#stage')).getPropertyValue('--sky') || '').match(/url\(["']?(.*?)["']?\)\s*$/) || [])[1] || '';
function wrapText(ctx, text, maxW) {
  const words = text.split(/\s+/), lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line); return lines;
}
async function makePostcard() {
  try { await document.fonts.load('40px "Patrick Hand"'); await document.fonts.load('600 26px Quicksand'); } catch (e) {}
  const snap = sceneSnapshot(), W = 1080, H = 1350, PH = 1150;
  const today0 = (S.diary || {})[dayKey()], line0 = today0 ? `“${today0.a}”` : `“${NOTES[Math.floor(Math.random() * NOTES.length)]}”`;
  if (window.xmasView) { try { const xc = await xmasCard(snap, line0); if (xc) return xc; } catch (e) {} }   // Vi's Christmas card frame
  const c = document.createElement('canvas'); c.width = W; c.height = H; const ctx = c.getContext('2d');
  ctx.fillStyle = '#FDF8EE'; ctx.fillRect(0, 0, W, H);
  // the window and the sill: scene units 0..714 wide, 120..~1010 high
  const sy = 175 * 1.5, sh = (PH / W) * snap.width;
  ctx.drawImage(snap, 0, sy, snap.width, sh, 40, 40, W - 80, PH - 40);
  ctx.strokeStyle = '#D4C5B0'; ctx.lineWidth = 3; ctx.strokeRect(40, 40, W - 80, PH - 40);
  if (window.xmasView) { try { await xmasPostcard(ctx, W, PH); } catch (e) {} }   // Giáng Sinh frame
  const line = line0;
  ctx.fillStyle = '#4A3525'; ctx.font = '40px "Patrick Hand", cursive'; ctx.textBaseline = 'top';
  const lines = wrapText(ctx, line, W - 140).slice(0, 3);
  lines.forEach((l, i) => ctx.fillText(l, 70, PH + 28 + i * 46));
  ctx.font = '600 24px Quicksand, sans-serif'; ctx.fillStyle = '#8a7560';
  ctx.fillText('Bên Khung Cửa Nhỏ · thaovi0308.github.io/little-sill', 70, H - 52);
  return c;
}

const KEYS = [261.63, 293.66, 329.63, 349.23, 392.0, 440.0, 493.88, 523.25];   // C4 … C5, 8 white keys
let farBus = null;
function piano(i, vol = 0.12, far = false, at = 0) {
  if (!AC || S.muted) return;
  const t = AC.currentTime + at, f = KEYS[i] || i;
  let dest = master;
  if (far) { if (!farBus) { farBus = filt('lowpass', 900, 0.7); farBus.connect(master); } dest = farBus; }
  tone(t, f, 1.6, vol, 'triangle', dest, 0.006); tone(t, f * 2, 0.7, vol * 0.25, 'sine', dest, 0.004); tone(t, f * 3, 0.35, vol * 0.08, 'sine', dest, 0.003);
}
const PHRASES = [[0, 2, 4, 4, 2, 0], [4, 5, 4, 2, 0, 2], [7, 4, 5, 4, 2, 4], [2, 4, 7, 5, 4, 2], [0, 0, 4, 5, 4, 2], [4, 2, 0, 2, 4, 4], [5, 4, 2, 4, 5, 7]];
function farTune(notes, gap = 0.55, vol = 0.05) { notes.forEach((n, k) => piano(n, vol, true, k * gap + Math.random() * 0.05)); }

let duet = null;   // { notes, i, turn: 'her'|'you', free }
function duetSay(t) { const e = $('#hd-text'); if (e) { e.textContent = t; bump(e, 'fade'); } }
function duetDots() { const e = $('#hd-dots'); if (e && duet && !duet.free) e.textContent = duet.notes.map((n, k) => k < duet.i ? '●' : '○').join(''); }
function openDuet() {
  if (!AC) initAudio(); duck(0.6);
  const free = S.hanh.duetDay === dayKey();
  const pick = PHRASES[(S.hanh.total + (new Date().getDate())) % PHRASES.length];
  duet = { notes: pick, i: 0, turn: 'her', free };
  const keys = ITEM_IMG.hanh_keys;
  hduet.innerHTML = `<div class="hd-card"><div class="hd-head">🎹 HÒA TẤU CÙNG CÔ <button id="hd-x" aria-label="Đóng">✕</button></div>
    <div class="hd-who">${hpic('hanh_play', '👵🏻🎹', 8)}</div>
    <div class="hd-keys${keys ? ' img' : ''}">${keys ? `<img src="${keys}" alt="">` : ''}${KEYS.map((_, k) => `<button class="hk" data-k="${k}" aria-label="Phím ${k + 1}"></button>`).join('')}</div>
    <div class="hd-dots" id="hd-dots"></div><div class="hd-text" id="hd-text"></div></div>`;
  hduet.classList.add('show');
  duetSay(free ? H.again : H.open); duetDots();
  if (!free) setTimeout(herTurn, 1100);
}
function closeDuet() { hduet.classList.remove('show'); duet = null; duck(1); }
function keyEl(k) { return hduet.querySelector(`.hk[data-k="${k}"]`); }
function herTurn() {
  if (!duet || duet.free || !hduet.classList.contains('show')) return;
  const k = duet.notes[duet.i], el = keyEl(k);
  piano(k, 0.07, true); el.classList.add('cue'); duet.turn = 'her';
  setTimeout(() => { el.classList.remove('cue'); if (!duet) return; el.classList.add('next'); duet.turn = 'you'; }, 650);
}
hduet.addEventListener('click', e => {
  e.stopPropagation();
  if (e.target === hduet || e.target.closest('#hd-x')) { closeDuet(); SFX.click(); return; }
  const b = e.target.closest('.hk'); if (!b || !duet) return;
  const k = +b.dataset.k; piano(k, 0.13);
  if (duet.free) { b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 300); return; }
  if (duet.turn !== 'you') return;
  const want = duet.notes[duet.i];
  if (k !== want) { bump(b, 'wig'); duetSay(H.miss); keyEl(want).classList.remove('next'); duet.turn = 'her'; setTimeout(herTurn, 700); return; }
  b.classList.remove('next'); b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 350);
  duet.i++; duetDots();
  if (duet.i < duet.notes.length) { duet.turn = 'her'; setTimeout(herTurn, 550); return; }
  // the whole phrase: both pianos play it together once, then the window blinks twice
  duet.turn = 'end'; S.hanh.duetDay = dayKey(); S.hanh.d++; S.hanh.total++; save();

const mixG = {};
let mixBus = null;
function mixEnsure(k) {
  if (!AC) return null;
  if (!mixBus) { mixBus = gain(1); mixBus.connect(master); }
  if (mixG[k]) return mixG[k];
  const g = mixG[k] = gain(0); g.connect(mixBus);
  const bedOf = { rain: 'amb_rain', night: 'amb_night', day: 'amb_day' }[k];
  if (bedOf) {
    const startBed = () => { if (!BUF[bedOf]) return false; const b = AC.createBufferSource(); b.buffer = BUF[bedOf]; b.loop = true; chain(b, gain(k === 'rain' ? 1.1 : 0.6), g); b.start(0, Math.random() * BUF[bedOf].duration); return true; };
    if (!startBed()) {
      if (k === 'rain') loopNoise('pink', chain(filt('highpass', 450), filt('lowpass', 3200), gain(0.5), g));
      else { const iv = setInterval(() => { if (startBed()) clearInterval(iv); }, 1500); }
    }
  }
  if (k === 'purr') {   // a low rumble at ~26 Hz with slow breathing
    const am = gain(0.5), br = gain(0.6); const o = AC.createOscillator(); o.frequency.value = 26; const od = gain(0.5); o.connect(od); od.connect(am.gain); o.start();
    const l = AC.createOscillator(); l.frequency.value = 0.28; const ld = gain(0.4); l.connect(ld); ld.connect(br.gain); l.start();
    loopNoise('brown', chain(filt('lowpass', 260), am, br, gain(1.4), g));
  }
  if (k === 'piano') g.connect(reverb);
  return g;
}
function mixApply(k) { const g = mixEnsure(k); if (g) g.gain.setTargetAtTime(S.mix[k] * (k === 'piano' ? 0.9 : 0.8), AC.currentTime, 0.2); }
const PENTA = [196.0, 220.0, 261.63, 293.66, 329.63, 392.0, 440.0, 523.25];

  const t = AC.currentTime, n = 1 + Math.floor(Math.random() * 3), base = Math.floor(Math.random() * 5);
  for (let i = 0; i < n; i++) { const f = PENTA[Math.min(PENTA.length - 1, base + Math.floor(Math.random() * 4))]; const at = t + i * (0.5 + Math.random() * 0.4);
    tone(at, f, 2.2, 0.06, 'triangle', mixG.piano, 0.01); tone(at, f * 2, 1.0, 0.012, 'sine', mixG.piano, 0.008); }
